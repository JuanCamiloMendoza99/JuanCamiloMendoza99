<title id="t">Juan Camilo Mendoza - Senior Full Stack Engineer</title>
<desc id="d">Retro arcade title screen with the name Juan Camilo Mendoza, the class Senior Full Stack Engineer, and a blinking Press Start prompt.</desc>
