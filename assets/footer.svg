<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="t d">
<title id="t">Thanks for playing</title>
<desc id="d">Retro arcade end screen reading Thanks for playing, insert coin to continue.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0f24"/><stop offset="1" stop-color="#1b0f3a"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" opacity="0.22"/>
  </pattern>
<clipPath id="r"><rect width="1200" height="130" rx="18"/></clipPath></defs>
<style>
  text { font-family: 'Courier New', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 700; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .march { animation: march 5s ease-in-out infinite alternate; }
  .tw1 { animation: twinkle 2.3s ease-in-out infinite; }
  .tw2 { animation: twinkle 3.1s ease-in-out infinite 0.7s; }
  .tw3 { animation: twinkle 4.2s ease-in-out infinite 1.3s; }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  @keyframes march { from { transform: translateX(-70px); } to { transform: translateX(70px); } }
  @keyframes twinkle { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.15; } }
  @media (prefers-reduced-motion: reduce) { .blink, .march, .tw1, .tw2, .tw3 { animation: none; } }
</style>
